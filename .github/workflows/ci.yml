name: CI

# Until now nothing verified pushes or pull requests: the only enforcement was
# the local git hooks in .githooks. This runs the portable gate set — every gate
# that does not need the owner's private curation tree.
#
# Deliberately NOT run here: `catalog:search:check` and the build-search-index
# determinism test, which rebuild the search index from the private semantic-lab
# source tree (see CLAUDE.md). They stay owner-machine gates; the test reports as
# an explicit skip rather than a silent pass.

on:
  push:
    # The repository default branch is still artcovr-storefront while main is the
    # consolidated product branch, and both are kept in sync. Cover both so the
    # gates run whichever one a change lands on.
    branches: [main, artcovr-storefront]
  # No base filter: a pull request against ANY branch is verified. With a
  # branches: [main] filter, a PR opened against the default branch would have
  # run no checks at all.
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      # The build pipeline runs node --experimental-strip-types, which needs >= 22.6.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify (portable gate set)
        run: bun run verify:ci
