name: CI

on:
  push:
    branches: [main, artcovr-storefront]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: artcovr_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/artcovr_test
      PORT: 45180
      BASE_PATH: /
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # This service is disposable; never use a production URL for schema push.
      - name: Create current workspace test schema
        run: pnpm --filter @workspace/db run push
      - name: Contracts, commerce, types, and production builds
        run: pnpm run verify:ci
      - name: Retained Supabase migration regression gate
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash scripts/db/verify-database.sh

  # Replit owns Clerk keys and deployment. This checks the deployed product,
  # not the candidate commit; candidate browser validation needs a Replit preview.
  hosted-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BASE_URL: https://artcovr.com
      PLAYWRIGHT_OUTPUT_DIR: ${{ github.workspace }}/playwright-results
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/artcovr exec playwright install --with-deps chromium
      - name: Read-only browser journeys against the Replit deployment
        run: pnpm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failures
          path: playwright-results/
          retention-days: 7
