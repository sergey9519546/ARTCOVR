name: Deploy Edge Functions

# WHY THIS EXISTS
# On 2026-08-31, 6 of the 9 Supabase Edge Functions were found missing from the
# live project — including create-checkout and stripe-webhook, so the storefront
# could not take money while every release gate was green. Deploying needs an
# owner access token, which no agent and no CI job should ever be handed
# directly. This workflow is the safe shape: the token lives as a GitHub
# repository secret, GitHub hands it to the runner, and nobody has to read it.
#
# MANUAL TRIGGER ONLY. This pushes code to your production backend, so it never
# fires on a push. You choose when it runs, and you can dry-run it first.
#
# ONE-TIME SETUP
#   1. Supabase dashboard -> Account -> Access Tokens -> generate a token.
#   2. GitHub repo -> Settings -> Secrets and variables -> Actions -> New
#      repository secret, named SUPABASE_ACCESS_TOKEN.
#   3. Run this workflow from the Actions tab.
#
# It does NOT touch your function secrets (OPENAI_API_KEY, STRIPE_SECRET_KEY,
# WATERMARK_RENDER_URL, ...). Those live in Supabase and are set separately with
# `supabase secrets set` — see supabase/README.md. A function deployed without
# its secrets will deploy fine and then fail at runtime, so check those first.

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: "Supabase project ref (public; from your project URL)"
        required: true
        default: "gcnamdbwekikkuqvzuko"
      dry_run:
        description: "Only report what WOULD deploy, change nothing"
        type: boolean
        default: true

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Fail early if the token is missing
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set. Add it under Settings -> Secrets and variables -> Actions, then re-run."
            exit 1
          fi
          echo "Token is present (value never printed)."

      - name: Deployment state BEFORE
        env:
          SUPABASE_PROJECT_REF: ${{ inputs.project_ref }}
        run: bun run check:deployment || true

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy every function in supabase/functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          # Directories starting with _ are shared code, not deployable functions.
          fns=$(find supabase/functions -mindepth 1 -maxdepth 1 -type d -not -name '_*' -printf '%f\n' | sort)
          echo "Functions found: $(echo "$fns" | tr '\n' ' ')"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "DRY RUN — nothing deployed. Re-run with dry_run unchecked to apply."
            exit 0
          fi
          for f in $fns; do
            echo "::group::deploy $f"
            supabase functions deploy "$f" --project-ref "${{ inputs.project_ref }}"
            echo "::endgroup::"
          done

      - name: Deployment state AFTER — fails unless every function is live
        if: ${{ inputs.dry_run == false }}
        env:
          SUPABASE_PROJECT_REF: ${{ inputs.project_ref }}
        run: bun run check:deployment

      - name: Reminder
        if: ${{ inputs.dry_run == false }}
        run: |
          echo "Deployed. Two things this workflow cannot do for you:"
          echo "  1. Point your Stripe webhook endpoint at the deployed stripe-webhook URL,"
          echo "     and enable charge.dispute.closed on it (see .agent-state/FOLLOWUPS.md)."
          echo "  2. Set function secrets in Supabase if they are not already set."
