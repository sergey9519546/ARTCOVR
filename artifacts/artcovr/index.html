<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="%BASE_URL%theme-init.js"></script>
    <style>
      html, body, #root {
        min-height: 100%;
        margin: 0;
      }
      html {
        background: #000;
        color: #f3ecd9;
      }
      html[data-theme="light"] {
        background: #f3ecd9;
        color: #000;
      }
      html[data-theme="dark"] {
        background: #000;
        color: #f3ecd9;
      }
      body { overflow-x: hidden; }
      #static-fallback {
        position: relative;
        display: grid;
        min-height: 100vh;
        place-items: center;
        overflow: hidden;
        background: transparent;
        color: inherit;
        font-family: Arial, sans-serif;
      }
      #static-fallback .static-fallback__wordmark {
        font-size: clamp(2.8rem, 9vw, 8.5rem);
        font-weight: 800;
        letter-spacing: -.08em;
        line-height: .85;
      }
      #static-fallback .static-fallback__counter {
        position: absolute;
        top: clamp(1.5rem, 5vw, 3rem);
        right: clamp(1rem, 5vw, 4rem);
        font-size: 1.5rem;
        line-height: 1;
      }
      #static-fallback .static-fallback__bar {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        height: 3px;
        background: color-mix(in srgb, currentColor 12%, transparent);
      }
      #static-fallback .static-fallback__copy {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
    </style>
    <!-- ARTCOVR_ROUTE_META_START -->
    <title>ARTCOVR | Curated Cover Art</title>
    <meta name="description" content="ARTCOVR is a curated storefront for distinctive square cover art with commercial licensing and prompt-based editing." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="ARTCOVR | Curated Cover Art" />
    <meta property="og:description" content="ARTCOVR is a curated storefront for distinctive square cover art with commercial licensing and prompt-based editing." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ARTCOVR" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://artcovr.com/" />
    <meta property="og:image" content="https://artcovr.com/og-image.png" />
    <meta property="og:image:alt" content="ARTCOVR curated cover art" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ARTCOVR | Curated Cover Art" />
    <meta name="twitter:description" content="ARTCOVR is a curated storefront for distinctive square cover art with commercial licensing and prompt-based editing." />
    <meta name="twitter:image" content="https://artcovr.com/og-image.png" />
    <meta name="twitter:image:alt" content="ARTCOVR curated cover art" />
    <link rel="canonical" href="https://artcovr.com/" />
    <!-- ARTCOVR_ROUTE_META_END -->
    <!-- ARTCOVR_ROUTE_STRUCTURED_DATA_START -->
    <script type="application/ld+json">
      {"@context":"https://schema.org","@type":"WebSite","name":"ARTCOVR","url":"https://artcovr.com/"}
    </script>
    <!-- ARTCOVR_ROUTE_STRUCTURED_DATA_END -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
  </head>
  <body>
    <div id="root">
      <!-- ARTCOVR_STATIC_CONTENT_START -->
      <main id="static-fallback" aria-label="Loading ARTCOVR">
        <div class="static-fallback__wordmark" aria-hidden="true">ARTCOVR</div>
        <div class="static-fallback__counter" aria-hidden="true">001</div>
        <div class="static-fallback__bar" aria-hidden="true"></div>
        <div class="static-fallback__copy">
          <h1>Cover art that becomes yours.</h1>
          <p>Browse owner-approved ARTCOVR cover artwork with clear commercial license terms.</p>
          <a href="/archive">Explore the cover art archive</a>
        </div>
      </main>
      <!-- ARTCOVR_STATIC_CONTENT_END -->
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
